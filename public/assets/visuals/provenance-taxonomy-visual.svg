<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 350" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="taxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <rect width="750" height="350" rx="14" fill="url(#taxBg)" stroke="rgba(255,255,255,0.08)"/>

  <text x="35" y="40" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800">5-TIER DATA PROVENANCE &amp; INTEGRITY TAXONOMY</text>
  <text x="35" y="60" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Zero fabricated data. Clear epistemological labels for every data attribute.</text>

  <!-- Tier 1: Verified -->
  <g transform="translate(30, 90)">
    <rect width="130" height="220" rx="8" fill="#0B0F19" stroke="rgba(16, 185, 129, 0.4)"/>
    <rect x="15" y="15" width="70" height="20" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="21" y="29" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">VERIFIED</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Direct Confirm</text>
    <text x="15" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
      <tspan x="15" dy="0">Active DNS MX</tspan>
      <tspan x="15" dy="14">records, live HTTP</tspan>
      <tspan x="15" dy="14">200 responses, and</tspan>
      <tspan x="15" dy="14">authoritative checks.</tspan>
    </text>
    <text x="15" y="195" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">Tier 1: Direct</text>
  </g>

  <!-- Tier 2: Publicly Listed -->
  <g transform="translate(170, 90)">
    <rect width="130" height="220" rx="8" fill="#0B0F19" stroke="rgba(6, 182, 212, 0.4)"/>
    <rect x="15" y="15" width="95" height="20" rx="4" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="21" y="29" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">PUBLIC LISTED</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Official Records</text>
    <text x="15" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
      <tspan x="15" dy="0">State corporate</tspan>
      <tspan x="15" dy="14">filings, business</tspan>
      <tspan x="15" dy="14">listings, and</tspan>
      <tspan x="15" dy="14">published phones.</tspan>
    </text>
    <text x="15" y="195" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="10">Tier 2: Primary</text>
  </g>

  <!-- Tier 3: Inferred -->
  <g transform="translate(310, 90)">
    <rect width="130" height="220" rx="8" fill="#0B0F19" stroke="rgba(14, 165, 233, 0.4)"/>
    <rect x="15" y="15" width="70" height="20" rx="4" fill="rgba(14, 165, 233, 0.15)"/>
    <text x="21" y="29" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">INFERRED</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Derived Intel</text>
    <text x="15" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
      <tspan x="15" dy="0">CMS platforms from</tspan>
      <tspan x="15" dy="14">script footprints</tspan>
      <tspan x="15" dy="14">and ad signals from</tspan>
      <tspan x="15" dy="14">active pixel tags.</tspan>
    </text>
    <text x="15" y="195" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">Tier 3: Analyzed</text>
  </g>

  <!-- Tier 4: Estimated -->
  <g transform="translate(450, 90)">
    <rect width="130" height="220" rx="8" fill="#0B0F19" stroke="rgba(245, 158, 11, 0.4)"/>
    <rect x="15" y="15" width="75" height="20" rx="4" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="21" y="29" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ESTIMATED</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Model Estimate</text>
    <text x="15" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
      <tspan x="15" dy="0">Opportunity scores</tspan>
      <tspan x="15" dy="14">and modeled ROI</tspan>
      <tspan x="15" dy="14">ranges computed</tspan>
      <tspan x="15" dy="14">from benchmarks.</tspan>
    </text>
    <text x="15" y="195" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="10">Tier 4: Model</text>
  </g>

  <!-- Tier 5: Unavailable -->
  <g transform="translate(590, 90)">
    <rect width="130" height="220" rx="8" fill="#0B0F19" stroke="rgba(148, 163, 184, 0.25)"/>
    <rect x="15" y="15" width="90" height="20" rx="4" fill="rgba(148, 163, 184, 0.1)"/>
    <text x="21" y="29" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">UNAVAILABLE</text>
    <text x="15" y="58" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">Honest Null</text>
    <text x="15" y="80" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">
      <tspan x="15" dy="0">When a field cannot</tspan>
      <tspan x="15" dy="14">be verified, it is</tspan>
      <tspan x="15" dy="14">marked unavailable.</tspan>
      <tspan x="15" dy="14">Never fabricated.</tspan>
    </text>
    <text x="15" y="195" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">Tier 5: Null Safe</text>
  </g>
</svg>
